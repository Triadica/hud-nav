name: Upload

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.repository }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.18.0 --activate
      - uses: calcit-lang/setup-calcit@ca701be5a471759e442aa053cd100720bbe1f09f # v1.5.0
        with:
          tools: calcit,caps
          caps-version: "0.1.1"
      - name: Install immutable dependencies
        run: |
          set -euo pipefail
          caps --strict --ci
          yarn install --immutable
          caps verify --toolchain
      - name: Check canonical Calcit and types
        run: |
          set -euo pipefail
          calcit edit format
          git diff --exit-code -- calcit.cirru
          calcit --check-only --all-defs
          calcit --check-only --ns hud-nav.comp --ns hud-nav.schema --summary-only
          calcit fix --workflow strict --verify --format json | jq -e '.data.workflow.status == "passed" and .diagnostics == []'
          calcit test --require-match
          calcit docs check-md README.md --snapshot calcit.cirru --failures-only
      - name: Build frontend
        env:
          VITE_BASE_URL: https://cos-sh.tiye.me/${{ github.repository }}/
        run: yarn build
      - name: Preserve frontend build for review
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Check current production revision
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: production
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          if [[ "$GITHUB_SHA" == "$current_sha" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skip stale production revision ${GITHUB_SHA}; current main is ${current_sha}."
          fi
      - name: Upload and verify frontend
        if: steps.production.outputs.current == 'true'
        timeout-minutes: 10
        uses: worktools/cos-upload-action@06d6027dcca6413c5936e04a9b6e9f0d5ef71ba0 # v1.2.0
        with:
          source-dir: dist/assets
          bucket: ${{ secrets.COS_BUCKET }}
          region: ap-shanghai
          prefix: ${{ github.repository }}/assets/
          public-base-url: https://cos-sh.tiye.me/${{ github.repository }}/assets/
          secret-id: ${{ secrets.COS_SECRET_ID }}
          secret-key: ${{ secrets.COS_SECRET_KEY }}
      - name: Recheck main before publishing the page
        if: steps.production.outputs.current == 'true'
        id: page-revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          if [[ "$GITHUB_SHA" == "$current_sha" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skip stale page revision ${GITHUB_SHA}; current main is ${current_sha}."
          fi
      - name: Deploy to server
        id: deploy
        if: steps.page-revision.outputs.current == 'true'
        uses: Pendect/action-rsyncer@8e05ffa5c93e5d9c9b167796b26044d2c616b2b9 # v2.0.0
        env:
          DEPLOY_KEY: ${{ secrets.rsync_private_key }}
        with:
          flags: '-avzr --progress'
          options: ''
          ssh_options: ''
          src: 'dist/*'
          dest: 'rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}'
      - name: Display server deployment status
        if: steps.page-revision.outputs.current == 'true'
        run: echo "${{ steps.deploy.outputs.status }}"
